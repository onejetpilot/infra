name: ${COMPOSE_PROJECT_NAME:-hadoop-local-lab}

x-hadoop-env: &hadoop-env
  HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
  HADOOP_HEAPSIZE_MAX: "1024"
  HDFS_USER: ${HDFS_USER:-student}
  HDFS_USERS: ${HDFS_USERS:-${HDFS_USER:-student}}
  HDFS_NAMENODE_USER: root
  HDFS_DATANODE_USER: root

x-service: &service
  restart: unless-stopped
  networks: [lab]

services:
  namenode:
    <<: *service
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
      args: { HADOOP_VERSION: "${HADOOP_VERSION:-3.3.6}" }
    hostname: namenode
    command: ["/opt/lab/bin/hadoop-entrypoint.sh", "namenode"]
    environment: *hadoop-env
    ports: ["9870:9870"]
    volumes:
      - namenode-data:/data/dfs/name
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./scripts:/opt/lab/scripts:ro
      - ./data:/opt/lab/data:ro
      - ./sql:/opt/lab/sql:ro
      - ./spark:/opt/lab/spark:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://namenode:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 2G } } }

  datanode1:
    <<: *service
    build: { context: ., dockerfile: docker/hadoop/Dockerfile, args: { HADOOP_VERSION: "${HADOOP_VERSION:-3.3.6}" } }
    hostname: datanode1
    command: ["/opt/lab/bin/hadoop-entrypoint.sh", "datanode"]
    environment: *hadoop-env
    ports: ["9864:9864"]
    volumes:
      - datanode1-data:/data/dfs/data
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
    depends_on: { namenode: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://datanode1:9864/jmx >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 2G } } }

  datanode2:
    <<: *service
    build: { context: ., dockerfile: docker/hadoop/Dockerfile, args: { HADOOP_VERSION: "${HADOOP_VERSION:-3.3.6}" } }
    hostname: datanode2
    command: ["/opt/lab/bin/hadoop-entrypoint.sh", "datanode"]
    environment: *hadoop-env
    ports: ["9865:9864"]
    volumes:
      - datanode2-data:/data/dfs/data
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
    depends_on: { namenode: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://datanode2:9864/jmx >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 2G } } }

  postgres:
    <<: *service
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metastore}
      POSTGRES_USER: ${POSTGRES_USER:-hive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports: ["15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  sql-train-db:
    <<: *service
    image: postgres:17-alpine
    container_name: sql-train-db
    shm_size: 256mb
    environment:
      POSTGRES_DB: sql_train
      POSTGRES_USER: student
      POSTGRES_PASSWORD: sqltrain2026
    ports: ["15433:5432"]
    volumes:
      - sql-train-data:/var/lib/postgresql/data
      - ../sql-train/sql:/workspace/sql:ro
      - ../sql-train/data/olist:/workspace/data:ro
      - ./training/sql/sql:/workspace/training:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d sql_train"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 2G } } }

  hive-metastore:
    <<: *service
    build: { context: ., dockerfile: docker/hive/Dockerfile, args: { HIVE_VERSION: "${HIVE_VERSION:-3.1.3}" } }
    hostname: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /opt/hive/conf
      HADOOP_USER_NAME: ${HDFS_USER:-student}
      SERVICE_OPTS: >-
        -Xmx1536m -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-metastore}
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER:-hive}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}
    ports: ["9083:9083"]
    volumes:
      - ./config/hadoop/core-site.xml:/opt/hive/conf/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hive/conf/hdfs-site.xml:ro
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    depends_on:
      postgres: { condition: service_healthy }
      namenode: { condition: service_healthy }
      datanode1: { condition: service_healthy }
      datanode2: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 2G } } }

  hiveserver2:
    <<: *service
    build: { context: ., dockerfile: docker/hive/Dockerfile, args: { HIVE_VERSION: "${HIVE_VERSION:-3.1.3}" } }
    hostname: hiveserver2
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_CUSTOM_CONF_DIR: /opt/hive/conf
      HADOOP_USER_NAME: hive
      HDFS_USER: ${HDFS_USER:-student}
      HDFS_USERS: ${HDFS_USERS:-${HDFS_USER:-student}}
      SERVICE_OPTS: "-Xmx3072m -Dhive.metastore.uris=thrift://hive-metastore:9083"
    ports: ["10001:10000", "10002:10002"]
    volumes:
      - ./config/hadoop/core-site.xml:/opt/hive/conf/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hive/conf/hdfs-site.xml:ro
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./sql:/opt/lab/sql:ro
    depends_on: { hive-metastore: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/10000'"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 4G } } }

  spark-master:
    <<: *service
    build: { context: ., dockerfile: docker/spark/Dockerfile, args: { SPARK_VERSION: "${SPARK_VERSION:-3.5.5}", HADOOP_VERSION: "${HADOOP_VERSION:-3.3.6}" } }
    hostname: spark-master
    command: ["/opt/spark/sbin/start-master.sh", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment: { SPARK_NO_DAEMONIZE: "true", HADOOP_USER_NAME: "${HDFS_USER:-student}", HDFS_USER: "${HDFS_USER:-student}" }
    ports: ["7077:7077", "8081:8080"]
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./config/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./config/spark:/opt/spark/conf-extra:ro
      - ./spark:/opt/lab/spark:ro
    depends_on: { hive-metastore: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 2G } } }

  spark-worker1:
    <<: *service
    build: { context: ., dockerfile: docker/spark/Dockerfile, args: { SPARK_VERSION: "${SPARK_VERSION:-3.5.5}", HADOOP_VERSION: "${HADOOP_VERSION:-3.3.6}" } }
    hostname: spark-worker1
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077", "--webui-port", "8081", "--cores", "4", "--memory", "6g"]
    environment: { SPARK_NO_DAEMONIZE: "true", HADOOP_USER_NAME: "${HDFS_USER:-student}", HDFS_USER: "${HDFS_USER:-student}" }
    ports: ["8082:8081"]
    volumes: ["./config/hadoop:/opt/hadoop/etc/hadoop:ro", "./config/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro"]
    depends_on: { spark-master: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 8G } } }

  spark-worker2:
    <<: *service
    build: { context: ., dockerfile: docker/spark/Dockerfile, args: { SPARK_VERSION: "${SPARK_VERSION:-3.5.5}", HADOOP_VERSION: "${HADOOP_VERSION:-3.3.6}" } }
    hostname: spark-worker2
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077", "--webui-port", "8081", "--cores", "4", "--memory", "6g"]
    environment: { SPARK_NO_DAEMONIZE: "true", HADOOP_USER_NAME: "${HDFS_USER:-student}", HDFS_USER: "${HDFS_USER:-student}" }
    ports: ["8083:8081"]
    volumes: ["./config/hadoop:/opt/hadoop/etc/hadoop:ro", "./config/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro"]
    depends_on: { spark-master: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 8G } } }

  jupyter:
    <<: *service
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
      target: jupyter
      args:
        SPARK_VERSION: "${SPARK_VERSION:-3.5.5}"
        HADOOP_VERSION: "${HADOOP_VERSION:-3.3.6}"
        JUPYTERLAB_VERSION: "${JUPYTERLAB_VERSION:-4.2.5}"
    hostname: jupyter
    working_dir: /opt/lab/notebooks
    command:
      - bash
      - -c
      - >-
        getent passwd "$$HADOOP_USER_NAME" >/dev/null ||
        useradd --badname --no-create-home --shell /usr/sbin/nologin "$$HADOOP_USER_NAME";
        exec python3 -m jupyter lab
        --ip=0.0.0.0 --port=8888 --no-browser --allow-root
        --ServerApp.root_dir=/opt/lab/notebooks
        --IdentityProvider.token="$$JUPYTER_TOKEN"
    environment:
      HADOOP_USER_NAME: ${HDFS_USER:-student}
      HDFS_USER: ${HDFS_USER:-student}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-local-lab}
      PYSPARK_SUBMIT_ARGS: >-
        --master spark://spark-master:7077
        --conf spark.driver.host=jupyter
        --conf spark.driver.bindAddress=0.0.0.0
        --conf spark.sql.catalogImplementation=hive
        --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
        --conf spark.hadoop.hadoop.user.group.static.mapping.overrides=${HDFS_USER:-student}=supergroup;hive=supergroup
        pyspark-shell
    ports: ["8888:8888"]
    volumes:
      - ./notebooks:/opt/lab/notebooks
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./config/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./spark:/opt/lab/spark:ro
      - ./sql:/opt/lab/sql:ro
      - ./training/sql/notebooks:/opt/lab/notebooks/sql-train
      - ./training/greenplum/notebooks:/opt/lab/notebooks/greenplum-train
      - ./training/hadoop:/opt/lab/hadoop-training:ro
      - ./training/hadoop/notebooks:/opt/lab/notebooks/hadoop-train
      - ./training/spark:/opt/lab/spark-training:ro
      - ./training/spark/notebooks:/opt/lab/notebooks/spark-train
      - ./training/common/notebooks:/opt/lab/notebooks/data-catalog
      - ./kafka_airflow/assignment_razhin:/opt/lab/notebooks/kafka-airflow-assignment
      - ./training/common/notebooks:/opt/lab/notebooks/data-catalog
    depends_on:
      spark-master: { condition: service_healthy }
      hiveserver2: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:8888/api/status?token=$$JUPYTER_TOKEN\" >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 4G } } }

  zeppelin:
    <<: *service
    user: "0:0"
    build:
      context: .
      dockerfile: docker/zeppelin/Dockerfile
      args: { ZEPPELIN_VERSION: "${ZEPPELIN_VERSION:-0.11.2}", SPARK_VERSION: "${SPARK_VERSION:-3.5.5}", HADOOP_VERSION: "${HADOOP_VERSION:-3.3.6}" }
    hostname: zeppelin
    command: ["bash", "-c", "sed 's/__HDFS_USER__/'\"$$HDFS_USER\"'/g' /opt/lab/zeppelin/interpreter.json > /opt/zeppelin/conf/interpreter.json && exec /opt/zeppelin/bin/zeppelin.sh"]
    environment:
      ZEPPELIN_ADDR: 0.0.0.0
      ZEPPELIN_PORT: "8080"
      ZEPPELIN_NOTEBOOK_DIR: /opt/zeppelin/notebook
      SPARK_MASTER: spark://spark-master:7077
      MASTER: spark://spark-master:7077
      HADOOP_USER_NAME: ${HDFS_USER:-student}
      HDFS_USER: ${HDFS_USER:-student}
      SPARK_SUBMIT_OPTIONS: "--conf spark.sql.catalogImplementation=hive --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083"
    ports: ["8080:8080"]
    volumes:
      - zeppelin-notebooks:/opt/zeppelin/notebook
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./config/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./config/zeppelin/interpreter.json:/opt/lab/zeppelin/interpreter.json:ro
      - ./spark:/opt/lab/spark:ro
      - ./sql:/opt/lab/sql:ro
    depends_on:
      spark-master: { condition: service_healthy }
      hiveserver2: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/version >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 6G } } }

  cbdb-segment-host-1:
    <<: *service
    image: infra-cbdb-pxf:1.6.0
    build: { context: ., dockerfile: docker/cloudberry-pxf/Dockerfile }
    container_name: cbdb-sdw1
    hostname: sdw1
    tty: true
    networks:
      lab:
      cbdb-interconnect:
        ipv4_address: 10.5.0.12
    volumes:
      - cbdb-segment1-data:/data0
      - ./config/hadoop/core-site.xml:/home/gpadmin/pxf-base/servers/default/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/home/gpadmin/pxf-base/servers/default/hdfs-site.xml:ro

  cbdb-segment-host-2:
    <<: *service
    image: infra-cbdb-pxf:1.6.0
    build: { context: ., dockerfile: docker/cloudberry-pxf/Dockerfile }
    container_name: cbdb-sdw2
    hostname: sdw2
    tty: true
    networks:
      lab:
      cbdb-interconnect:
        ipv4_address: 10.5.0.13
    volumes:
      - cbdb-segment2-data:/data0
      - ./config/hadoop/core-site.xml:/home/gpadmin/pxf-base/servers/default/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/home/gpadmin/pxf-base/servers/default/hdfs-site.xml:ro

  cbdb-coordinator:
    <<: *service
    image: infra-cbdb-pxf:1.6.0
    build: { context: ., dockerfile: docker/cloudberry-pxf/Dockerfile }
    container_name: cbdb-cdw3
    hostname: cdw
    tty: true
    environment:
      MULTINODE: "true"
    ports: ["25432:5432"]
    networks:
      lab:
      cbdb-interconnect:
        ipv4_address: 10.5.0.10
    volumes:
      - cbdb-coordinator-data:/data0
      - ./docker/cloudberry-pxf/start-with-pxf.sh:/usr/local/bin/start-with-pxf.sh:ro
      - ./config/hadoop/core-site.xml:/home/gpadmin/pxf-base/servers/default/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/home/gpadmin/pxf-base/servers/default/hdfs-site.xml:ro
      - ./training:/opt/training:ro
      - ./data/gpfdist:/home/gpadmin/gpfdist:ro

  cbdb-standby-coordinator:
    <<: *service
    image: infra-cbdb-pxf:1.6.0
    build: { context: ., dockerfile: docker/cloudberry-pxf/Dockerfile }
    container_name: cbdb-scdw
    hostname: scdw
    tty: true
    networks:
      lab:
      cbdb-interconnect:
        ipv4_address: 10.5.0.11
    volumes:
      - cbdb-standby-data:/data0
      - ./config/hadoop/core-site.xml:/home/gpadmin/pxf-base/servers/default/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/home/gpadmin/pxf-base/servers/default/hdfs-site.xml:ro

  kafka-task-db:
    <<: *service
    image: postgres:16.6-bookworm
    hostname: kafka-task-db
    environment:
      POSTGRES_DB: ${KAFKA_TASK_DB:-kafka_task}
      POSTGRES_USER: ${KAFKA_TASK_USER:-kafka_user}
      POSTGRES_PASSWORD: ${KAFKA_TASK_PASSWORD:-kafka2026}
    ports: ["15434:5432"]
    volumes:
      - kafka-task-data:/var/lib/postgresql/data
      - ./kafka_airflow/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 1G } } }

  kafka:
    <<: *service
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    ports: ["9092:9092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    deploy: { resources: { limits: { memory: 2G } } }

  kafka-init:
    image: apache/kafka:3.9.0
    restart: "no"
    networks: [lab]
    depends_on:
      kafka: { condition: service_healthy }
    command:
      - bash
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic task_events_log_razhin
        --partitions 3 --replication-factor 1

  kafka-ui:
    <<: *service
    image: ghcr.io/kafbat/kafka-ui:latest
    hostname: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports: ["8091:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 512M } } }

  clickhouse:
    <<: *service
    image: clickhouse/clickhouse-server:26.5
    hostname: clickhouse
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse2026}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user student --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 4G } } }

  airflow-db:
    <<: *service
    image: postgres:16.6-bookworm
    hostname: airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    ports: ["15435:5432"]
    volumes: ["airflow-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 1G } } }

  airflow-init:
    image: infra-airflow-kafka:2.10.5
    build: { context: ., dockerfile: docker/airflow/Dockerfile }
    restart: "no"
    networks: [lab]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Moscow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-airflow-secret-key}
      AIRFLOW__CORE__FERNET_KEY: ""
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: task_events_log_razhin
      KAFKA_CONSUMER_GROUP: task_events_consumer_razhin
      KAFKA_TASK_DB_HOST: kafka-task-db
      KAFKA_TASK_DB_PORT: "5432"
      KAFKA_TASK_DB: ${KAFKA_TASK_DB:-kafka_task}
      KAFKA_TASK_USER: ${KAFKA_TASK_USER:-kafka_user}
      KAFKA_TASK_PASSWORD: ${KAFKA_TASK_PASSWORD:-kafka2026}
    volumes:
      - ./kafka_airflow/assignment_razhin/dags:/opt/airflow/dags:ro
      - ./kafka_airflow/src:/opt/airflow/kafka_task:ro
      - ./kafka_airflow/assignment_razhin:/opt/airflow/kafka_assignment:ro
      - ./kafka_source_data:/opt/airflow/source_data:ro
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-db: { condition: service_healthy }
      kafka-task-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create
        --username "${AIRFLOW_ADMIN_USER:-airflow}"
        --password "${AIRFLOW_ADMIN_PASSWORD:-airflow}"
        --firstname Local --lastname Admin
        --role Admin --email airflow@local.test || true)

  airflow-webserver:
    <<: *service
    image: infra-airflow-kafka:2.10.5
    build: { context: ., dockerfile: docker/airflow/Dockerfile }
    hostname: airflow-webserver
    environment: *airflow-env
    command: webserver
    ports: ["8090:8080"]
    volumes:
      - ./kafka_airflow/assignment_razhin/dags:/opt/airflow/dags:ro
      - ./kafka_airflow/src:/opt/airflow/kafka_task:ro
      - ./kafka_airflow/assignment_razhin:/opt/airflow/kafka_assignment:ro
      - ./kafka_source_data:/opt/airflow/source_data:ro
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 2G } } }

  airflow-scheduler:
    <<: *service
    image: infra-airflow-kafka:2.10.5
    build: { context: ., dockerfile: docker/airflow/Dockerfile }
    hostname: airflow-scheduler
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./kafka_airflow/assignment_razhin/dags:/opt/airflow/dags:ro
      - ./kafka_airflow/src:/opt/airflow/kafka_task:ro
      - ./kafka_airflow/assignment_razhin:/opt/airflow/kafka_assignment:ro
      - ./kafka_source_data:/opt/airflow/source_data:ro
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 20s
      timeout: 10s
      retries: 30
    deploy: { resources: { limits: { memory: 2G } } }

